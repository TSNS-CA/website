# Cloudflare Worker + static assets.
#
# `name` MUST match the Worker's name in the Cloudflare dashboard, otherwise
# Workers Builds fails before it even starts.
name = "tsns"
compatibility_date = "2026-08-02"

# The API lives in functions/ (Pages-style file routing). The build compiles it
# into a single Worker script with:
#   npx wrangler pages functions build --outdir=worker
# It is written to worker/ — outside dist/ — so it is never uploaded as a
# static asset, which saves needing an .assetsignore.
main = "./worker/index.js"

# Per-branch preview URLs (the Workers equivalent of Pages preview deployments).
preview_urls = true

# Runtime config (SUPABASE_*, SQUARE_*, RESEND_*, STUDENT_COUPON_CODES) is
# entered in the dashboard under Settings -> Variables and Secrets, not here.
#
# By default `wrangler deploy` DELETES every plain-text var before applying the
# ones in this file — and this file has no [vars] block, so every deploy wiped
# the dashboard values and left only the ones marked Secret (secrets are never
# touched by a deploy). keep_vars stops that.
#
# The trade-off: this file is no longer the source of truth for vars. If you
# ever move them here into a [vars] block, drop this line. Never put a token or
# key in [vars] — this repository is public.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

# React Router owns /bagis, /gonullu, /about ... — none of which exist as files,
# so unmatched paths must return index.html.
not_found_handling = "single-page-application"

# Workers serve static assets *before* the Worker; Pages did the opposite. With
# SPA handling on, /api/* would otherwise be answered with index.html instead of
# reaching the API. This flips the order back for the API only, so page loads
# stay pure asset hits (not billed as Worker invocations).
run_worker_first = ["/api/*"]
